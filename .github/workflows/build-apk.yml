name: Build PrimeVision APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyxelStream-PrimeVision-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: VyxelStream v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 🎬 VyxelStream / PrimeVision v1.0.0
            
            Premium Streaming App UI built with Kotlin + Jetpack Compose.
            
            ### ✨ Features:
            - **Cinematic Dark Obsidian Interface**: Emerald & Teal gradients with Liquid Glass elements.
            - **3 Main Screens**:
              - 🏠 **Home**: Movie & Series carousels, category filters, interactive search.
              - 🎬 **Movie Details**: Edge-to-edge cinematic hero artwork, Play Now / Download buttons, IMDb rating badges, and scene stills.
              - ❤️ **Favourites**: Streaming platform filters (HBO Max, Disney+, Apple TV, Netflix) with featured cards.
            - **Plugin Ready**: Cloudstream `.cs3` extension adapter integration.
            
            ### 📥 Download:
            Download and install `app-debug.apk` below on your Android device!
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
